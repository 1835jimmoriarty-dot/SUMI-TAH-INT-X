version: '3.8'

# ============================================================
# SUMI-TAH Integrated Threat-Hunting Platform
# Docker Compose — Production Configuration
#
# REQUIRED ENVIRONMENT VARIABLES (set in .env or shell):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   JWT_SECRET, ENCRYPTION_KEY
# ============================================================

services:
  # ── SUMI-TAH SOC Application ───────────────────────────────
  sumi-tah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumi-tah-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      SESSION_EXPIRY_HOURS: "${SESSION_EXPIRY_HOURS:-24}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '[startup] Running database migrations...' &&
        npx prisma db push --schema=prisma/schema.postgresql.prisma --skip-generate &&
        echo '[startup] Seeding initial data...' &&
        npx tsx prisma/seed.ts &&
        echo '[startup] Starting SUMI-TAH application...' &&
        node server.js
      "
    networks:
      - sumitah-net

  # ── PostgreSQL 16 Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sumitah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sumitah-net

  # ── Redis Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sumitah-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sumitah-net

volumes:
  postgres_data:
  redis_data:

networks:
  sumitah-net:
    driver: bridge